### Global variables ###
seed: 1
img_size: 112
sensor: "S1"

sensor_num_bands:
  S1: 2
  S2: 10
sensor_bands:
  S1: ["VH", "VV"]
  S2: ["B02", "B03", "B04", "B05", "B06", "B07", "B08", "B8A", "B11", "B12"]

in_chans: ${sensor_num_bands.${sensor}}
bands: ${sensor_bands.${sensor}}
patch_size: 8
mask_ratio: 0.75
max_epochs: 100

defaults:
  - _self_
  - paths: cluster
  - experiment: baseline

runs_json: "artifacts/runs-${sensor}.json"
resume_ckpt_path: null # Only Lightning resumes from this checkpoint. WandB starts fresh.

### Training hyperparameters ###
batch_size: 512
accumulate_grad_batches: 1
base_lr: 3e-4
warmup_frac: 0.1

weight_decay: 0.05
gradient_clip_val: 1.0
precision: "bf16-mixed"

# Hardware
num_workers: 12
prefetch_factor: 3

### Logging ###
wandb:
  project: "RS_MAE-Paper"
  run_name: "${experiment_name}-${now:%m.%d_%H:%M}"
  run_id: null # both Lightning and WandB resume this run
  outdir: ${paths.wandb_outdir}
log_every_n_steps: 100

### Model ###
model:
  img_size: ${img_size}

  # Encoder
  patch_size: ${patch_size}
  in_chans: ${in_chans}
  embed_dim: 384
  depth: 12
  num_heads: 6

  # Decoder
  decoder_embed_dim: 192
  decoder_depth: 4
  decoder_num_heads: 6
  
  # Model Hyperparameters
  mlp_ratio: 4.0
  drop_path_rate: 0.0
  cls_token: true
  norm_layer:
    _target_: torch.nn.LayerNorm
    _partial_: true
    eps: 1e-6
    
  normalize: true
  bands: ${bands}

### Data ###
dataset:
  data_dir: ${paths.reben_dir}
  keys_path: ${paths.reben_keys}
  split_file: "datasets/splits/reben.parquet"
  align_size: 120
  sensor: ${sensor}
  bands: ${bands}
  normalize: false # performed inside the model forward pass

  val_to_train_frac: 0.85
  test_to_train_frac: 1.0
  seed: ${seed}
  blocklist_path: "datasets/splits/reben_7k_ood.csv"

  return_mask: false
  include_unlisted: false
