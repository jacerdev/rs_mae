# @package _global_

img_size: 128
batch_size: 16
num_classes: 13
num_bands: 4

# Data
dataset:
  data_dir: ${paths.c2seg_dir}
  city: "augsburg" 
  split_frac: 0.8 # at most 0.855 to ensure validation split bigger than img_size=128
  bands: ["B02", "B03", "B04", "B08"]
  normalize: false

  grid_sampling: true
  crop_size: 128 # => grid shift margin = (886*.8 - 5*128, 1360 - 10*128) = (68, 80)

dataset_name: "c2seg_${dataset.city}"
  

