# @package _global_

img_size: 256
batch_size: 16
num_classes: 6

sensor_num_bands:
  S1: 2
  S2: 10
sensor_bands:
  S1: ["VH", "VV"]
  S2: ["B02", "B03", "B04", "B05", "B06", "B07", "B08", "B8A", "B11", "B12"]
sensor_data_dir: # S2: m-cashew-plantation (GEO-Bench), S1: x-cashew-benin (GeoCrossBench)
  S1: ${paths.cashew_benin_dir}
  S2: ${paths.cashew_plantation_dir}

num_bands: ${sensor_num_bands.${sensor}}

# Data
dataset:
  data_dir: ${sensor_data_dir.${sensor}}
  split_file: "datasets/splits/cashew_plantation.csv"
  sensor: ${sensor}
  bands: ${sensor_bands.${sensor}}
  normalize: false

  grid_sampling: false
  crop_size: null
  min_margin: 0

dataset_name: "cashew_plantation"
  
