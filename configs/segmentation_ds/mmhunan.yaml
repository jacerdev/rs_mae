# @package _global_

img_size: 256
batch_size: 16
num_classes: 7

sensor_num_bands:
  S1: 2
  S2: 10
sensor_bands:
  S1: ["VH", "VV"]
  S2: ["B02", "B03", "B04", "B05", "B06", "B07", "B08", "B8A", "B11", "B12"]

num_bands: ${sensor_num_bands.${sensor}}

# Data
dataset:
  data_dir: ${paths.mmhunan_dir}
  split_file: "datasets/splits/mmhunan.csv"
  sensor: ${sensor}
  bands: ${sensor_bands.${sensor}}
  normalize: false

  grid_sampling: false
  crop_size: null
  min_margin: 0

dataset_name: "mmhunan"
  
