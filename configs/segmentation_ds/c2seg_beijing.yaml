# @package _global_

img_size: 256
batch_size: 16
num_classes: 13
num_bands: 4

# Data
dataset:
  data_dir: ${paths.c2seg_dir}
  city: "beijing" 
  split_frac: 0.85
  bands: ["B02", "B03", "B04", "B08"]
  normalize: false

  grid_sampling: true
  crop_size: 256 # ==> grid shift margin = (13474 - 256*52, 8706*0.865 - 256*29) = (162, 106.69)

dataset_name: "c2seg_${dataset.city}"
  
