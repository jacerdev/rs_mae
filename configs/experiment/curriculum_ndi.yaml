# @package _global_
experiment_name: "curriculum_ndi"

masker:
  _target_: models.strategies.masker.CurriculumMasker
  max_epochs: ${max_epochs}
  easy_end: 0.0 # no easy phase (min_w is not used)
  hard_start: 0.3 # start hard phase at 30% of training
  min_w: null
  max_w: 0.5
  mixed_batch: false

saliency_extractor:
  _target_: utils.features.NDISaliency
  patch_size: ${patch_size}
  bands: ${bands}

target:
  _target_: models.strategies.target.NormalizedPixelTarget
  patch_size: ${patch_size}
  in_chans: ${in_chans}

loss:
  _target_: models.strategies.loss.MaskedMSELoss

use_last_ckpt: true