# @package _global_
experiment_name: "curriculum_feat_unif"

masker:
  _target_: models.strategies.masker.CurriculumMasker
  max_epochs: ${max_epochs}
  easy_end: 0.0 # no easy phase (min_w is not used)
  hard_start: 0.3 # start hard phase at 30% of training
  min_w: null
  max_w: 1.0
  mixed_batch: true

saliency_extractor:
  _target_: utils.features.NDISaliency
  patch_size: ${patch_size}
  bands: ${bands}

target:
  _target_: models.strategies.target.HOGNDITarget
  norm_pix: true # per patch z normalization (after HOG/NDI computation)
  # NDI
  bands: ${bands}
  # HOG
  patch_size: ${patch_size}
  pool: 8 # must be a divisor of patch_size
  nbins: 9
  use_max_gradient: true
  gaussian_window: null # 14 := grid_size i.e. img_size // patch_size
  normalize: true # per grid cell L2 normalization over bins

loss:
  _target_: models.strategies.loss.uniformity.UniformityEnhancedMAELoss
  lambda_unif: 0.01
  base_loss:
    _target_: models.strategies.target.hog_ndi.HOGNDILoss

use_last_ckpt: true
