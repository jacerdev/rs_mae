# @package _global_
experiment_name: "curriculum_hog"

masker:
  _target_: models.strategies.masker.CurriculumMasker
  max_epochs: ${max_epochs}
  easy_end: 0.0 # no easy phase (min_w is not used)
  hard_start: 0.5 # start hard phase at 50% of training
  min_w: null
  max_w: 0.5
  mixed_batch: false

saliency_extractor:
  _target_: utils.features.HOGSaliency
  nbins: 9
  pool: ${patch_size}
  in_channels: ${in_chans}

target:
  _target_: models.strategies.target.NormalizedPixelTarget
  patch_size: ${patch_size}
  in_chans: ${in_chans}

loss:
  _target_: models.strategies.loss.MaskedMSELoss

use_last_ckpt: true
