# @package _global_
experiment_name: "feat_guided"

masker:
  _target_: models.strategies.masker.RandomMasker

target:
  _target_: models.strategies.target.HOGNDITarget
  norm_pix: true # per patch z normalization (after HOG/NDI computation)
  # NDI
  bands: ${bands}
  # HOG
  patch_size: ${patch_size}
  pool: 8 # must be a divisor of patch_size
  nbins: 9
  use_max_gradient: true
  gaussian_window: null # 14 := grid_size i.e. img_size // patch_size
  normalize: true # per grid cell L2 normalization over bins

loss:
  _target_: models.strategies.target.hog_ndi.HOGNDILoss # wrapper of MSE to separate HOG and NDI losses
