# @package _global_
experiment_name: "glcm_loss"

masker:
  _target_: models.strategies.masker.RandomMasker

target:
  _target_: models.strategies.target.NormalizedPixelTarget
  patch_size: ${patch_size}
  in_chans: ${in_chans}

loss:
  _target_: models.strategies.loss.glcm.MaskedGLCMLoss
  in_chans: ${in_chans}
  patch_size: ${patch_size}
  group_tokens: 2
  stride_tokens: 1

  chunk_size: -1  # no chunking -- full M*C batch fits comfortably on A100 40GB
  bins: 16
  min_val: -3.0   # assuming z-normalized data
  max_val: 3.0
  bandwidth: null  # defaults to (max_val - min_val) / (2 * bins) = 6.0 / 32 = 0.1875

  alpha: 3e5
  warmup_start_epoch: 20
  warmup_epochs: 70
