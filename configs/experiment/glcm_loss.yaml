# @package _global_
experiment_name: "glcm_loss"

masker:
  _target_: models.strategies.masker.RandomMasker

target:
  _target_: models.strategies.target.NormalizedPixelTarget
  patch_size: ${patch_size}
  in_chans: ${in_chans}

loss:
  _target_: models.strategies.loss.glcm.MaskedGLCMLoss
  in_chans: ${in_chans}
  patch_size: ${patch_size}
  group_tokens: 2
  stride_tokens: 2

  chunk_size: 'auto' # dynamically fills available VRAM
  bins: 16
  min_val: -3.0 # assuming z normalized data
  max_val: 3.0  #
  bandwidth: null # Defaults to (max_val - min_val) / (2 * bins) to preserve gradient flow. e.g. 6.0 / (2 * 16) = 0.1875
  
  alpha: 3e5
  warmup_start_epoch: 20
  warmup_epochs: 70
