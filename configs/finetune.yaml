# Global variables
seed: 42
patch_size: 8 # img_size must be divisible by `2*patch_size` for the FPN segmentation head
pretrained_ckpt_export_path: best_pretrained_ckpt.txt

defaults:
  - _self_
  - paths: cluster
  - segmentation_ds: reben_7k

# Training hyperparameters
accumulate_grad_batches: 1
max_epochs: 100
base_lr: 3e-5
layer_lr_decay: 0.85
reduce_lr_factor: 0.5
reduce_lr_threshold: 1e-2
reduce_lr_patience: 4
early_stop_patience: 15

weight_decay: 0.05
gradient_clip_val: 1.0
precision: "bf16-mixed"

# Hardware
num_workers: 26
prefetch_factor: 4

# Logging
experiment_name: "baseline"
wandb:
  project: "RS_MAE-Thesis"
  run_name: "${experiment_name}-${dataset_name}-${now:%m.%d_%H:%M}"
  run_id: null
  outdir: ${paths.wandb_outdir}
log_every_n_steps: 20

### Model ###
model:
  # Segmentation head
  num_classes: ${num_classes}
  pyramid_channels: 256
  segmentation_channels: 128

  img_size: ${img_size}

  # Encoder
  patch_size: ${patch_size}
  in_chans: ${num_bands}
  embed_dim: 384
  depth: 12
  num_heads: 6

  # Model Hyperparameters
  mlp_ratio: 4.0
  drop_path_rate: 0.0
  cls_token: true
  norm_layer:
    _target_: torch.nn.LayerNorm
    _partial_: true
    eps: 1e-6

