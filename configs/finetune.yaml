# Global variables
seed: 42
patch_size: 8 # img_size must be divisible by `2*patch_size` for the FPN segmentation head

defaults:
  - _self_
  - paths: cluster
  - segmentation_ds: reben_7k

experiment_name: "baseline"
runs_json: "runs.json"
results_dir: "results"

# Training hyperparameters
accumulate_grad_batches: 1
max_epochs: 100
early_stop_patience: 99
base_lr: 1.5e-4
warmup_frac: 0.05
layer_lr_decay: 0.65

weight_decay: 0.05
gradient_clip_val: 1.0
precision: "16-mixed"

# Hardware
num_workers: 8
prefetch_factor: 4

# Logging
wandb:
  project: "RS_MAE-Thesis"
  run_name: "${experiment_name}-${dataset_name}-${now:%m.%d_%H:%M}"
  run_id: null
  outdir: ${paths.wandb_outdir}
log_every_n_steps: 20

### Model ###
model:
  # Segmentation head
  num_classes: ${num_classes}
  pyramid_channels: 256
  segmentation_channels: 128

  img_size: ${img_size}

  # Encoder
  patch_size: ${patch_size}
  in_chans: ${num_bands}
  embed_dim: 384
  depth: 12
  num_heads: 6

  # Model Hyperparameters
  mlp_ratio: 4.0
  drop_path_rate: 0.0
  cls_token: true
  norm_layer:
    _target_: torch.nn.LayerNorm
    _partial_: true
    eps: 1e-6
    
  normalize: true
  bands: ${dataset.bands}

